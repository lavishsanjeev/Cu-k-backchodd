
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Song</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .player {
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 28px;
    }

    p {
      color: #aaa;
    }

    button {
      background: white;
      color: black;
      border: none;
      border-radius: 30px;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>
  <div class="player">
    <h1>🎵 Your Song</h1>
    <p>Put on your headphones.</p>

    <button id="playButton">▶ Play Song</button>

    <audio id="song" autoplay loop preload="auto">
      <source src="song.mp3" type="audio/mpeg">
      Your browser does not support audio.
    </audio>
  </div>

  <script>
    const song = document.getElementById("song");
    const button = document.getElementById("playButton");

    function playSong() {
      song.play()
        .then(() => {
          button.textContent = "♫ Playing...";
        })
        .catch(() => {
          button.textContent = "▶ Tap to Play";
        });
    }

    // Try autoplay when the page opens
    window.addEventListener("load", playSong);

    // Play immediately when the visitor taps the button
    button.addEventListener("click", playSong);
  </script>
</body>
</html>
